<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plant Provisions Catch Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #e8f5e9; /* Light green background */
      overflow: hidden;
    }
    canvas {
      display: block;
      margin: 0 auto;
      background-color: #ffffff; /* White canvas background */
    }
    #game-over {
      display: none;
      text-align: center;
      margin-top: 100px;
    }
    #game-over h1 {
      color: #388e3c;
    }
    button {
      padding: 10px 20px;
      background-color: #388e3c;
      color: white;
      border: none;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover {
      background-color: #2e7d32;
    }
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
    }
    #controls button {
      padding: 15px 25px;
      background-color: #388e3c;
      color: white;
      border: none;
      font-size: 24px;
      cursor: pointer;
      border-radius: 10px;
    }
    #controls button:active {
      background-color: #2e7d32;
    }
    @media (min-width: 600px) {
      #controls {
        display: none;
      }
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="800" height="600"></canvas>
  <div id="game-over">
    <h1>Game Over!</h1>
    <p>Your score: <span id="score">0</span></p>
    <button onclick="restartGame()">Play Again</button>
  </div>
  <div id="controls">
    <button id="leftBtn">← Left</button>
    <button id="rightBtn">→ Right</button>
  </div>
  <script src="game.js"></script>
</body>
</html>
